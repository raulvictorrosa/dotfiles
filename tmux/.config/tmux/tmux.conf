# Config split across conf.d/ by concern — see each file for its scope.
# plugins.conf must be sourced last: TPM's `run` needs the options set by
# the earlier files (e.g. the tokyo-night theme vars in statusbar.conf)
# already in place when it launches the plugins.
source-file $XDG_CONFIG_HOME/tmux/conf.d/options.conf
source-file $XDG_CONFIG_HOME/tmux/conf.d/bindings.conf
source-file $XDG_CONFIG_HOME/tmux/conf.d/statusbar.conf
source-file $XDG_CONFIG_HOME/tmux/conf.d/plugins.conf
