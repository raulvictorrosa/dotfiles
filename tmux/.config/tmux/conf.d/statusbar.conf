# Status bar layout/behavior — follows omarchy's tmux config. Only the
# structural bits (position, lengths, titles); colors/content still come
# from the tokyo-night-tmux plugin below (or dracula, commented), not
# omarchy's own native status-bar theme.
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# set -g @dracula-plugins "batery git weather time"
