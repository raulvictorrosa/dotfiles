# Follows omarchy's tmux config (basecamp/omarchy, config/tmux/tmux.conf),
# keeping the plugin-managed tokyo-night/dracula theme (see statusbar.conf)
# instead of omarchy's own native status-bar theme.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Force the terminal to use a blinking line cursor (code 5 for blinking bar) for all terminal types within tmux
set -as terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Explicitly tell newer tmux versions that the terminal supports cursor style changes
set -as terminal-features ',*:cstyle'

set-window-option -g mode-keys vi
