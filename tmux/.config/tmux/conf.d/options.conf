set -g mouse on
set -ga terminal-overrides ",screen-256color*:Tc"
set -g default-terminal "tmux-256color"

# Force the terminal to use a blinking line cursor (code 5 for blinking bar) for all terminal types within tmux
set -as terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# Explicitly tell newer tmux versions that the terminal supports cursor style changes
set -as terminal-features ',*:cstyle'

# Let kitty-graphics-protocol escape sequences (used by Snacks.image) pass
# through tmux to the outer terminal (ghostty) instead of being eaten
set -g allow-passthrough on

# set -s escape-time 0

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

set-window-option -g mode-keys vi
